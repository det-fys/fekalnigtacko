<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Fekalni gtacko</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <style>
        * {
            font-family: "Comic Sans MS", Verdana, Geneva, Tahoma, sans-serif;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: #222;
            color: #fff;
            text-align: center;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, -2px 0 0 #000, 2px 0 0 #000, 0 -2px 0 #000, 0 2px 0 #000;
        }

        h1 {
            color: #ff0
        }

        input[type=text] {
            background-color: #444;
            color: #fff;
            border-style: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #vyplnitmeno{
            font-size: 100pt;
            color: red;
            font-weight: bold;
            margin: 0;
            margin-bottom: 100px;
        }

        #okbut
        {
            font-size: 20pt;
            font-weight: bold;
            padding: 10pt;
            margin: 10pt;
        }

        #name, #url
        {
            font-size: 150%;
            margin: 10pt;
        }
    </style>
</head>

<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" style="display:none"></canvas>

    <div id="loginform">
        <h1>fekální gtačko</h1>

        <form>
            kdo <input type="text" name="name" id="name" placeholder="vyplnit"><br>
            <p id="vyplnitmeno" style="display:none">^ vyplnit</p>
            
            kam <input type="text" name="url" id="url" value="wss://test.deadfish.cz"><br>
            <input id="okbut" type="button" value="probíhá získávání" onclick="ok()" disabled>
        </form>
    </div>

    <script>
        var inited = false;

        var Module = {
            preRun: [],
            postRun: [],
            canvas: (function() {
            return document.getElementById('canvas');
            })(),
            onRuntimeInitialized: function() {
                inited = true;
                const okbut = document.getElementById("okbut");
                okbut.value = "0k";
                okbut.disabled = false;
            }
        };

        // function resizeCanvas() {
        //     const canvas = document.getElementById('canvas');
        //     canvas.width = window.innerWidth;
        //     canvas.height = window.innerHeight;
        //     console.log(window.innerWidth, window.innerHeight);
        //     console.log(screen.width, screen.height);
        // }

        // window.addEventListener('resize', resizeCanvas);
        // window.addEventListener('load', resizeCanvas);
        // document.addEventListener('fullscreenchange', resizeCanvas);
        // document.addEventListener('webkitfullscreenchange', resizeCanvas); // Safari

        function ok()
        {
            if (!inited)
                return;

            const name = document.getElementById("name").value;
            const url = document.getElementById("url").value;
        
            if (name == "") {
                document.getElementById("vyplnitmeno").style = "";
                return;
            }

            localStorage.setItem("fg_name", name);
            localStorage.setItem("fg_url", url);

            Module.ccall("SetName", null, ["string"], [name]);
            Module.ccall("SetUrl", null, ["string"], [url]);

            document.getElementById("loginform").style = "display:none";
            document.getElementById("canvas").style = "";

            FS.mkdir('/persistent');
            FS.mount(IDBFS, { "autoPersist": true }, '/persistent');
            FS.syncfs(true, (err) => {
                if (err) {
                    console.error(err);
                    return;
                }

                console.log("Filesystem ready");

                // setInterval(() => {
                //     FS.syncfs(false, (err) => {
                //         if (err) console.error(err);
                //     });
                // }, 10000);

                Module.ccall("RunMain", null, [], []);
            });

        }

        function loadConfig() 
        {
            const saved_name = localStorage.getItem("fg_name");
            const saved_url = localStorage.getItem("fg_url");
            if (saved_name != null)
                document.getElementById("name").value = saved_name;
            if (saved_url != null)
                document.getElementById("url").value = saved_url;
        }

        loadConfig();
        document.getElementById("okbut").disabled = true;
    </script>

    {{{ SCRIPT }}}
</body>

</html>
